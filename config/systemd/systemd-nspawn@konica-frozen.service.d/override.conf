# Host-side drop-in for Fedora's stock systemd-nspawn@.service template.
# Installed by scripts/install-host-integration.sh to
#   /etc/systemd/system/systemd-nspawn@konica-frozen.service.d/override.conf
#
# The app is the container's only process on a read-only root. No private
# users (USB access), no private network (host 127.0.0.1), no Alpine init.
# A service Environment= line is NOT inherited by PID 1 in the container, so
# every setting is passed with nspawn's --setenv= below.

[Unit]
Description=Frozen minimal IPP Everywhere print server (bizhub 206)
ConditionPathExists=/var/lib/machines/konica-frozen/usr/local/bin/konica206-native
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
Type=simple
RemainAfterExit=no
ExecStart=
# @IPP_PORT@ is substituted at install time (default 8001).
# --read-only repeats ReadOnly=yes from the .nspawn file so the freeze holds
# either way; the two host binds below provide the only writable storage.
ExecStart=/usr/bin/systemd-nspawn --quiet --keep-unit --read-only --directory=/var/lib/machines/konica-frozen --machine=konica-frozen --settings=override --setenv=KONICA_RASTER_ONLY=1 --setenv=KONICA_VENDOR_FILTER=/usr/local/lib/konica/konica-native --setenv=KONICA_PPD=/usr/local/share/konica/KonicaMinolta-206-native.ppd --setenv=TMPDIR=/var/tmp /usr/local/bin/konica206-native server -o server-port=@IPP_PORT@ -o listen=localhost
Restart=on-failure
RestartSec=10s
TimeoutStopSec=30s
KillMode=mixed

# Lowered now; Phase 5 replaces these with measured values if needed.
CPUWeight=50
IOWeight=50
# Memory cap stays off until Phase 5 gives a measured number:
# MemoryMax=96M

# Bind mounts alone are not enough: nspawn's device cgroup blocks libusb_open()
# without this rule. Major 189 (char-usb_device) allows unplug/replug.
DeviceAllow=char-usb_device rwm
